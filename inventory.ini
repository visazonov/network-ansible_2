# Controller (config generate / Batfish later). Does not SSH to devices.
[local]
localhost ansible_connection=local

# Lab EVE EOS. Creds: group_vars/arista_lab.yml (ANSIBLE_*_LAB).
[arista_lab]
leaf412 ansible_host=10.0.150.152
leaf413 ansible_host=10.0.150.150
leaf414 ansible_host=10.0.150.151
Sw503 ansible_host=10.0.150.170
Sw504 ansible_host=10.0.150.171

# Prod EOS. Creds: group_vars/arista_prod.yml (ANSIBLE_USER / ANSIBLE_PASSWORD, LDAP).
[arista_prod]
switch517 ansible_host=10.5.2.4
# leaf_412_prod ansible_host=10.7.66.12

[arista_eos:children]
arista_lab
arista_prod

[arista_eos:vars]
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=arista.eos.eos
ansible_network_cli_ssh_type=libssh

# Lab vMX. Creds: group_vars/juniper_lab.yml (JUNOS_* , fallback ANSIBLE_*_LAB).
[juniper_lab]
lab-vmx ansible_host=10.0.150.172

# Prod MX. Creds: group_vars/juniper_prod.yml (same LDAP as arista_prod).
[juniper_prod]
router501 ansible_host=10.5.0.101

[juniper_junos:children]
juniper_lab
juniper_prod

[juniper_junos:vars]
ansible_connection=ansible.netcommon.netconf
ansible_port=830
ansible_network_os=junipernetworks.junos.junos
# ansible_connection=ansible.netcommon.network_cli



# Uncomment and set ansible_host to the EVE-NG management IP of each node.
[cisco_ios]
# eve-sw1 ansible_host=192.0.2.10

[cisco_ios:vars]
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios
ansible_become=true
ansible_become_method=enable