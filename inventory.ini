# Controller (config generate / Batfish later). Does not SSH to devices.
[local]
localhost ansible_connection=local

# Uncomment and set ansible_host to the EVE-NG management IP of each node.
[cisco_ios]
# eve-sw1 ansible_host=192.0.2.10

[cisco_ios:vars]
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios
ansible_become=true
ansible_become_method=enable

[arista_eos]
leaf412 ansible_host=10.0.150.152
leaf413 ansible_host=10.0.150.150
leaf414 ansible_host=10.0.150.151
Sw503 ansible_host=10.0.150.170
Sw504 ansible_host=10.0.150.171
# leaf_412_prod ansible_host=10.7.66.12

[arista_eos:vars]
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=arista.eos.eos
ansible_network_cli_ssh_type=libssh

# Junos: set ansible_host to the lab vMX / RE management IP. No enable (not IOS/EOS).
[juniper_junos]
lab-vmx ansible_host=10.0.150.172

[juniper_junos:vars]
ansible_connection=ansible.netcommon.netconf
ansible_port=830
# ansible_connection=ansible.netcommon.network_cli
ansible_network_os=junipernetworks.junos.junos

