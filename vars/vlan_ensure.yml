# Job file: which hosts + which VLANs.
# Hosts must exist in inventory.ini (connection/OS live there, not here).
target_hosts:
  - Sw503
  # - Sw504
  # - leaf412
  # - leaf413
  # - leaf414
  # - leaf_412_prod
  - lab-vmx

# EOS: vlan_id + name. Junos: irb_address; prefix_lists + network for policy-options.
# Empty prefix_lists = L2/L3 only (no NAT/BGP prefix-list).
vlans:
  - vlan_id: 20
    name: ansible-test-20
    irb_address: 10.83.0.101/24
    network: 10.83.0.0/24
    prefix_lists:
      - lan-msk-export
      - NAT
  # - vlan_id: 21
  #   name: ansible-test-21
  #   irb_address: 10.83.4.101/24
  #   network: 10.83.4.0/24
  #   prefix_lists: []

vlan_interfaces:
  - ge-0/0/2
  - ae0
l3_instance: lan
l2_instance: lan-l2
